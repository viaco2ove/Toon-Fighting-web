<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>选人 · Toon-Fighting</title>
<style>
:root{--bg:#07080b;--line:#262c38;--txt:#f2ecdf;--dim:#8b96a8;--hot:#ff3b30;--gold:#ffc233;--cyan:#3ad1ff}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#000;font-family:'Noto Sans SC','Microsoft YaHei',system-ui,sans-serif;color:var(--txt);overflow:hidden;padding:12px}
.metal{background:linear-gradient(180deg,#fdf8ec 0%,#d8cfc0 40%,#8a8074 52%,#efe9dc 58%,#5a5248 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;font-style:italic}

/* ---------------- 街机外壳 ---------------- */
.arcade{position:relative;height:100%;border-radius:8px;overflow:hidden;
  background:linear-gradient(180deg,#efc4b2 0%,#dfa48f 16%,#c2766a 40%,#94514c 62%,#5f363a 82%,#3b2127 100%)}
/* 云层 */
.arcade::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:
   radial-gradient(460px 140px at 16% 80%,rgba(255,241,235,.55),transparent 70%),
   radial-gradient(560px 160px at 52% 88%,rgba(255,241,235,.46),transparent 70%),
   radial-gradient(480px 150px at 86% 82%,rgba(255,241,235,.4),transparent 70%),
   radial-gradient(760px 220px at 40% 100%,rgba(255,246,240,.34),transparent 72%)}
/* 顶部暗框 */
.arcade::after{content:'';position:absolute;top:0;left:0;right:0;height:76px;pointer-events:none;
  background:linear-gradient(180deg,rgba(26,17,16,.92),rgba(58,34,30,.5) 62%,transparent)}

/* ---------------- 顶部条 ---------------- */
.top{position:absolute;top:0;left:0;right:0;height:76px;z-index:30;display:grid;
  grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:0 14px}
.menuwrap{position:relative}
.menubtn{cursor:pointer;font-family:inherit;font-size:12px;font-weight:900;letter-spacing:.2em;padding:9px 18px;border-radius:7px;
  border:1px solid rgba(255,255,255,.4);background:rgba(8,8,14,.72);color:#fff;backdrop-filter:blur(3px)}
.menubtn:hover{border-color:var(--cyan)}
.menudd{position:absolute;top:46px;left:0;display:none;flex-direction:column;gap:6px;min-width:186px;z-index:40;
  background:rgba(8,8,14,.9);border:1px solid rgba(255,255,255,.3);border-radius:10px;padding:10px;backdrop-filter:blur(4px)}
.menudd.open{display:flex}
.menudd button{cursor:pointer;font-family:inherit;font-size:12px;font-weight:800;letter-spacing:.1em;text-align:left;
  padding:9px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);color:#f0e6da}
.menudd button:hover{border-color:var(--gold);color:#fff;background:rgba(255,194,51,.12)}
.logo{justify-self:center;transform:skewX(-6deg);font-size:clamp(17px,3vw,40px);font-weight:900;letter-spacing:.06em;
  font-style:italic;white-space:nowrap;pointer-events:none;min-width:0;max-width:100%;overflow:hidden;
  background:linear-gradient(180deg,#f8f4ea 0%,#cfc6b8 38%,#8a8074 50%,#e8e2d6 56%,#6a6258 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(2px 3px 0 rgba(0,0,0,.55)) drop-shadow(0 6px 10px rgba(0,0,0,.3))}
.tbwrap{display:flex;gap:10px;align-items:center;justify-self:end}
.tabs{display:flex;gap:8px}
.tb{cursor:pointer;font-family:inherit;font-size:11.5px;font-weight:800;letter-spacing:.1em;padding:6px 16px;border-radius:16px;
  border:1px solid rgba(255,255,255,.3);background:rgba(10,10,14,.55);color:#f0e6da;backdrop-filter:blur(2px)}
.tb.on{border-color:var(--hot);color:#fff;background:rgba(180,40,30,.42)}
.cnt{display:flex;gap:6px;align-items:center;font-size:11px;color:#f0e6da}

/* ---------------- 三栏 ---------------- */
.stage{position:absolute;top:80px;bottom:92px;left:14px;right:14px;z-index:10;
  display:grid;grid-template-columns:clamp(168px,21%,320px) minmax(0,1fr) clamp(140px,19%,290px);gap:14px}

/* 左右 toonflow 头像面板 */
.panel{position:relative;display:flex;flex-direction:column;min-width:0;border-radius:6px;overflow:hidden;
  background:linear-gradient(160deg,rgba(55,38,44,.72),rgba(14,11,16,.86));border:1px solid rgba(255,255,255,.34);
  box-shadow:0 12px 30px rgba(0,0,0,.35)}
.panel.p1{clip-path:polygon(0 0,100% 0,92% 100%,0 100%)}
.panel.p2{clip-path:polygon(8% 0,100% 0,100% 100%,0 100%)}
.panel .phead{display:flex;align-items:center;gap:8px;padding:10px 14px 6px}
.panel.p1 .phead{padding-right:34px}
.panel.p2 .phead{padding-left:34px}
.panel .title{font-size:10px;letter-spacing:.16em;color:#ffe9e0;font-weight:800;text-shadow:0 1px 3px #000;white-space:nowrap}
.swp{margin-left:auto;cursor:pointer;font-family:inherit;font-size:10.5px;font-weight:900;letter-spacing:.06em;padding:4px 10px;
  border-radius:14px;border:1px solid rgba(255,255,255,.4);background:rgba(10,10,14,.5);color:var(--cyan);white-space:nowrap}
.swp:hover{color:#fff;border-color:var(--cyan)}

/* 出场位（含出场序号） */
.slots{display:flex;gap:8px;padding:0 14px 8px}
.panel.p2 .slots{padding-left:24px}
.panel.p1 .meta{padding-right:34px}
.slot{position:relative;width:clamp(62px,7vw,92px);flex:0 0 auto;cursor:pointer;display:flex;flex-direction:column;gap:4px;align-items:center;
  padding:5px 4px 4px;border-radius:8px;border:1px solid rgba(255,255,255,.26);background:rgba(8,8,14,.42)}
.slot.on{border-color:var(--hot);box-shadow:0 0 10px rgba(255,59,48,.45);background:rgba(180,40,30,.28)}
.slot .th{width:100%;height:clamp(62px,7vw,92px);border-radius:5px;overflow:hidden;display:flex;align-items:center;justify-content:center;
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.06) 0 6px,rgba(0,0,0,.18) 6px 12px);border:1px solid rgba(255,255,255,.28)}
.slot .th img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
.slot .lb{font-size:9px;color:#ffe9e0;letter-spacing:.04em;white-space:nowrap}
.slot .od{position:absolute;top:-6px;left:-4px;min-width:16px;height:16px;line-height:16px;text-align:center;border-radius:8px;
  font-size:9.5px;font-weight:900;color:#241a06;background:linear-gradient(180deg,#ffe08a,#e2a308);box-shadow:0 2px 6px rgba(0,0,0,.45)}

/* 大头像 */
.portrait{position:relative;flex:1;margin:0 12px;border:2px solid rgba(255,255,255,.6);border-radius:4px;overflow:hidden;
  background:#0b0b12;min-height:0}
.portrait img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
.portrait::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.18),transparent 30%,transparent 55%,rgba(6,6,10,.92))}
.portrait .plate{position:absolute;left:0;right:0;bottom:0;padding:8px 12px 10px;z-index:2}
.plate .nm{font-size:clamp(18px,2.4vw,30px);font-weight:900;letter-spacing:.02em;line-height:1.05;
  background:linear-gradient(180deg,#fdf8ec 0%,#d8cfc0 40%,#8a8074 52%,#efe9dc 58%,#5a5248 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;font-style:italic;
  filter:drop-shadow(2px 3px 0 rgba(0,0,0,.6));transform:skewX(-6deg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plate .jobs{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}
.job{font-size:9.5px;letter-spacing:.12em;color:var(--gold);border:1px solid rgba(255,194,51,.55);border-radius:12px;padding:1.5px 9px;white-space:nowrap}
.plate .ent{font-size:11px;color:var(--cyan);font-family:Consolas,monospace;white-space:nowrap}
.portrait .vacant{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;z-index:1;
  background:repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 10px,rgba(0,0,0,.22) 10px 20px)}
.portrait .vacant .q{font-size:46px;font-weight:900;color:rgba(255,255,255,.55)}
.portrait .vacant .t{font-size:11px;color:#ffe9e0;letter-spacing:.1em}

/* 面板底部信息 */
.meta{padding:9px 14px 12px;display:flex;flex-direction:column;gap:5px;font-size:11.5px}
.meta .row{display:flex;justify-content:space-between;gap:6px;color:#f0e6da;white-space:nowrap;min-width:0}
.meta .k{color:#c8b8b0;letter-spacing:.06em;font-size:10px;flex:none}
.meta .v{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;text-align:right}
.meta .v.ent{font-family:Consolas,monospace;color:var(--cyan);font-weight:700}

/* 中栏：2 · MUGEN 角色 */
.mid{display:flex;flex-direction:column;min-width:0;min-height:0;gap:8px}
.hero{position:relative;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;padding-top:2px}
.hero .hlab{font-size:9.5px;letter-spacing:.2em;font-weight:800;color:#ffe9e0;text-shadow:0 1px 3px #000}
.hero .figbox{position:relative;flex:1 1 auto;min-height:70px;width:100%;display:flex;align-items:flex-end;justify-content:center}
.hero .figbox .ghost{position:absolute;left:50%;top:11%;transform:translate(-50%,-50%) skewX(-6deg);z-index:0;
  font-size:clamp(46px,7.2vh,92px);font-weight:900;font-style:italic;letter-spacing:.04em;white-space:nowrap;pointer-events:none;
  color:rgba(255,236,214,.30);-webkit-text-stroke:1px rgba(255,255,255,.30);
  text-shadow:0 6px 24px rgba(0,0,0,.35)}
.hero .figbox::before{content:'';position:absolute;left:50%;bottom:-6px;width:min(72%,520px);height:74%;transform:translateX(-50%);
  background:radial-gradient(ellipse at 50% 78%,rgba(255,226,196,.50),rgba(255,176,132,.22) 46%,transparent 74%);pointer-events:none}
.hero .figbox::after{content:'';position:absolute;left:50%;bottom:-4px;width:240px;height:26px;transform:translateX(-50%);
  background:radial-gradient(ellipse,rgba(0,0,0,.45),transparent 70%);pointer-events:none}
.hero .figbox img{position:relative;z-index:1;height:100%;width:auto;max-width:96%;object-fit:contain;image-rendering:pixelated;
  filter:drop-shadow(0 14px 16px rgba(0,0,0,.55)) drop-shadow(0 0 22px rgba(255,180,120,.18))}
.hero .figbox .none{position:relative;z-index:1;font-size:12px;color:#ffe9e0;align-self:center;letter-spacing:.1em}
.hero .hinfo{display:flex;align-items:center;gap:10px;margin-top:2px;padding:5px 16px;border-radius:20px;
  background:rgba(8,8,12,.78);border:1px solid rgba(255,255,255,.24);backdrop-filter:blur(3px);max-width:100%}
.hero .hinfo .who{font-size:14px;font-weight:900;white-space:nowrap}
.hero .hinfo .x{color:#8b96a8;font-size:11px}
.hero .hinfo .ent{font-size:11.5px;color:var(--cyan);font-family:Consolas,monospace;white-space:nowrap}
.hero .hinfo .job{font-size:9.5px}
.hero .figbox .silh{filter:brightness(0) opacity(.42) !important}
.hero .hdesc{margin-top:4px;font-size:10.5px;color:#ffe4da;opacity:.9;text-shadow:0 1px 3px #000;text-align:center;
  max-width:92%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

/* 选人列表 */
.listrow{flex:none;display:flex;align-items:center;gap:10px;height:26px}
.qbtn{font-family:inherit;cursor:pointer;display:flex;align-items:center;gap:6px;padding:0 9px;height:22px;border-radius:4px;
  font-size:10.5px;letter-spacing:.06em;color:#ffe9e0;background:rgba(12,10,22,.55);border:1px solid rgba(255,212,120,.5)}
.qbtn b{font-size:14px;color:#ffd76a;line-height:1}
.qbtn span{font-size:9px;opacity:.7}
.qbtn:hover{border-color:#ffd76a;background:rgba(60,20,30,.7)}
.qbtn.sel{color:#0b0b12;background:linear-gradient(180deg,#ffe487,#c99a2e);border-color:#3a2606}
.qbtn.sel b,.qbtn.sel span{color:#0b0b12;opacity:.85}
.qbtn:disabled{opacity:.35;cursor:default}
.pager{flex:none;display:none;align-items:center;gap:8px;height:22px;margin-left:auto;font-size:10px;letter-spacing:.1em;color:#ffe9e0;text-shadow:0 1px 3px #000}
.pager .pg{font-family:inherit;cursor:pointer;width:24px;height:18px;line-height:16px;text-align:center;padding:0;border-radius:3px;font-size:12px;font-weight:900;
  color:#0b0b12;background:linear-gradient(180deg,#ffe487,#c99a2e);border:1px solid rgba(0,0,0,.45)}
.pager .pg:disabled{opacity:.35;cursor:default}
.pager .pgt b{font-size:12.5px;color:#ffd76a}
.pager .pgt i{font-style:normal;opacity:.75;margin-left:6px}
.k.void{visibility:hidden;pointer-events:none}
.rozlist{flex:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.k{position:relative;cursor:pointer;font-family:inherit;text-align:left;padding:6px 7px 7px;border-radius:4px;
  border:2px solid rgba(255,255,255,.72);color:#fff;overflow:hidden;
  background:linear-gradient(160deg,rgba(74,52,58,.9),rgba(30,20,24,.94))}
.k:hover{border-color:var(--gold);background:linear-gradient(160deg,rgba(112,72,72,.9),rgba(46,30,34,.94))}
.k.sel{border-color:#ffd34d;box-shadow:0 0 14px rgba(255,211,77,.6),inset 0 0 16px rgba(255,211,77,.2)}
.k .face{position:absolute;top:5px;left:5px;width:clamp(20px,2.1vw,30px);height:clamp(20px,2.1vw,30px);image-rendering:pixelated;
  border:1px solid rgba(255,255,255,.55);border-radius:3px;background:#0b0b12}
.k .ord{position:absolute;top:-1px;right:-1px;min-width:18px;height:18px;line-height:18px;text-align:center;font-size:10px;font-weight:900;
  color:#241a06;background:linear-gradient(180deg,#ffe08a,#e2a308);border-bottom-left-radius:8px}
.k .fig{display:flex;align-items:flex-end;justify-content:center;height:clamp(44px,7vh,74px);margin-top:3px}
.k .fig img{max-height:100%;width:auto;image-rendering:pixelated;filter:drop-shadow(0 4px 6px rgba(0,0,0,.6))}
.k .nm{display:block;font-size:11.5px;font-weight:900;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k .sub{display:block;font-size:9px;color:#dcc6ba;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k .sub em{font-style:normal;color:var(--cyan);font-family:Consolas,monospace}
.k .jobline{display:inline-block;font-size:8.5px;letter-spacing:.1em;color:var(--gold);border:1px solid rgba(255,194,51,.45);
  border-radius:10px;padding:0 6px;margin-top:3px}
.k.q{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:linear-gradient(160deg,rgba(60,44,50,.9),rgba(26,18,22,.94))}
.k .rnd{position:absolute;top:5px;right:5px;width:18px;height:18px;line-height:17px;text-align:center;font-size:11px;font-weight:900;
  color:#0a0a12;background:linear-gradient(180deg,#ffe487,#d8a12e);border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.5);z-index:2}
.k.q .qm{font-size:clamp(26px,3vw,40px);font-weight:900;line-height:1;color:#e8cfc6;text-shadow:0 3px 10px rgba(0,0,0,.6)}
.k.q .nm{font-size:11px;margin-top:2px}
.k.q .sub{font-size:8.5px;color:#caa79e}

/* ---------------- 底部 ---------------- */
.foot{position:absolute;left:14px;right:14px;bottom:14px;height:66px;z-index:20;display:flex;gap:10px;align-items:stretch}
.namebar{flex:1;min-width:0;display:flex;gap:10px;align-items:center;padding:8px 14px;border-radius:10px;overflow:hidden;
  background:rgba(8,8,12,.84);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(3px)}
.namebar .role{font-size:13px;font-weight:900;white-space:nowrap}
.namebar .ent{font-size:11.5px;color:var(--cyan);font-family:Consolas,monospace;white-space:nowrap}
.namebar .job{font-size:9px}
.namebar .lineup{margin-left:auto;display:flex;gap:4px;flex:none}
.namebar .lineup img{width:26px;height:26px;border-radius:4px;object-fit:cover;object-position:top center;display:block;
  border:1px solid rgba(255,255,255,.5)}
.diff{display:flex;gap:6px;align-items:center;font-size:11.5px;color:#f0e6da;white-space:nowrap}
.diff select{font-family:inherit;font-size:11.5px;padding:7px 8px;border-radius:8px;background:rgba(10,10,14,.75);
  border:1px solid rgba(255,255,255,.3);color:#fff}
#start{cursor:pointer;font-family:inherit;font-size:16px;font-weight:900;letter-spacing:.28em;text-indent:.28em;padding:0 40px;
  border-radius:11px;border:1px solid rgba(255,255,255,.45);color:#fff;background:linear-gradient(180deg,#c8281e,#7a1410);
  box-shadow:0 6px 20px rgba(200,40,30,.4)}
#start:hover{filter:brightness(1.15)}
#start:disabled{opacity:.42;cursor:not-allowed;box-shadow:none;filter:none}

.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:rgba(10,10,14,.92);border:1px solid var(--cyan);
  color:#fff;font-size:12.5px;padding:9px 20px;border-radius:20px;opacity:0;white-space:nowrap;max-width:92vw;transition:.25s;pointer-events:none;z-index:99}
.toast.on{opacity:1}

/* 生存模式：对手面板变系统随机 */
.panel.p2.sysrand .portrait img{filter:grayscale(1) brightness(.55) contrast(1.1)}
.panel.p2.sysrand .plate .nm{opacity:.45}
.surnote{display:none;padding:0 14px 10px;font-size:10px;line-height:1.7;color:#ffe9e0}
.panel.p2.sysrand .surnote{display:block}
.panel.p2.sysrand .swp{display:none}   /* 生存模式对手不可调序 */

@media (max-width:1180px){
  .plate .nm{font-size:clamp(18px,2.6vw,26px)}
  .meta{font-size:11px}
  .foot{gap:8px}
  #start{padding:0 26px;font-size:14.5px;letter-spacing:.2em;text-indent:.2em}
}
@media (max-width:920px){
  body{padding:8px}
  /* 「？」随机按钮窄屏只留「？ 随机」，翻页条同排右对齐 */
  .qbtn{white-space:nowrap;flex:none;padding:0 7px}
  .qbtn span{display:none}
  .pager{gap:6px;font-size:9.5px}
  .pager .pgt i{display:none}
  .stage{left:10px;right:10px;top:74px;bottom:126px;gap:10px;
    grid-template-columns:clamp(140px,25%,200px) minmax(0,1fr) clamp(120px,22%,180px)}
  .top{height:70px;padding:0 10px;gap:8px}
  .menubtn{padding:8px 12px;letter-spacing:.12em}
  .tb{padding:5px 11px;letter-spacing:.04em;font-size:11px}
  .cnt{font-size:10px}
  .panel .phead{padding:8px 10px 5px}
  .panel .title{font-size:8.5px;letter-spacing:.06em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .panel.p1 .phead{padding-right:22px}
  .panel.p2 .phead{padding-left:22px}
  .swp{padding:3px 7px;font-size:9.5px;letter-spacing:0}
  .swpt{display:none}
  .meta{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
  .meta .row{flex:0 0 auto;gap:4px}
  .meta .row:nth-child(3){display:none}
  .tword{display:none}
  .panel .title{font-size:9px}
  .panel .surnote{font-size:8.5px;line-height:1.5;padding:0 9px 8px}
  .meta .k{display:inline;font-size:8px;letter-spacing:.03em;opacity:.78}
  .meta .v{font-size:9.5px;text-align:left;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.16);border-radius:3px;padding:1px 5px}
  .slots{padding:0 9px 6px;gap:5px}
  .slot{width:auto;max-width:96px;flex:1 1 0;min-width:0;padding:2px}
  .slot .th{height:36px}
  .slot .lb{display:none}
  .slot .od{min-width:13px;height:13px;line-height:13px;font-size:8px;top:-4px;left:-3px}
  .portrait{margin:0 9px}
  .meta{padding:7px 10px 9px;font-size:10.5px}
  .panel.p1 .meta{padding-right:22px}
  .panel.p2 .slots{padding-left:16px}
  .k{padding:5px 5px 6px}
  .k .nm{font-size:10.5px}
  .k .sub{font-size:8px}
  .k .jobline{display:none}
  .k.q .qm{font-size:30px}
  .k.q .sub{display:none}
  .foot{flex-wrap:wrap;height:auto;gap:6px;left:10px;right:10px;bottom:10px}
  .namebar{flex:1 1 0;min-width:0;padding:7px 9px}
  .namebar .lineup{display:none}
  .diff{flex:1 1 auto}
  #start{flex:0 0 auto;padding:8px 22px;font-size:13.5px;letter-spacing:.18em;text-indent:.18em}
}
</style>
</head>
<body>
<div class="arcade">
  <div class="top">
    <div class="menuwrap">

    <!-- 3 · 对手 TOONFLOW 角色 -->
    <aside class="panel p2" id="p2panel">
      <div class="phead">
        <span class="title" id="p2cap">3 · 对手 <span class="tword">TOONFLOW 角色</span></span>
        <button class="swp" onclick="rotateOrder(2)">⇄ <span class="swpt">出场顺序</span></button>
      </div>
      <div class="slots" id="p2slots"></div>
      <div class="portrait" id="p2port">
        <img id="p2img" alt="">
        <div class="vacant" id="p2vac"><span class="q">？</span><span class="t">空位 · 点右侧选人列表</span></div>
        <div class="plate">
          <div class="nm" id="p2name">&nbsp;</div>
          <div class="jobs"><span class="ent" id="p2ent">&nbsp;</span><span class="job" id="p2job">—</span></div>
        </div>
      </div>
      <div class="surnote">生存模式：对手由系统按资产集随机生成<br>胜利 +1 续关，失败回主界面</div>
      <div class="meta">
        <div class="row"><span class="k">角色</span><span class="v" id="p2m1">—</span></div>
        <div class="row"><span class="k">实体</span><span class="v ent" id="p2m2">—</span></div>
        <div class="row"><span class="k">职业·出场</span><span class="v" id="p2m3">—</span></div>

  <div class="foot">
    <div class="namebar" id="bar1"></div>
    <div class="namebar" id="bar2"></div>
    <div class="diff">难度
      <select id="diffsel">
        <option>简单</option><option selected>普通</option><option>困难</option><option>地狱</option>
      </select>
    </div>
    <button id="start" onclick="go()">开 始</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ---------------- 数据（对齐资产集 mapping.json + 故事角色 t_storyWorld#48） ---------------- */
const A = 'assets/select/';
/* 10 个真实故事角色，各自按《角色职业.md》归到 5 个引擎实体之一（一个实体可被多个角色复用） */
const pool = [
  { r:'林羽',   job:'武道家',        id:'Rugal2nd', ms:'m_rugal',  ts:'t_linyu',
    desc:'解析系觉醒者，读穿每个选项背后的结局' },
  { r:'苏晚晴', job:'异能者',        id:"K'",       ms:'m_k',      ts:'t_suwanqing',
    desc:'医学院急救出身，回溯 10 秒印证解析' },
  { r:'江浩',   job:'军人/佣兵',     id:'Leona',    ms:'m_leona',  ts:'t_jianghao',
    desc:'体育生蛮力觉醒，营地第一战力担当' },
  { r:'林悦',   job:'忍者/刺客',     id:'Lin',      ms:'m_lin',    ts:'t_linyue',
    desc:'失散三月归来，腕上神幕金环的活线索' },
  { r:'老雷',   job:'军人/佣兵',     id:'Leona',    ms:'m_leona',  ts:'t_laolei',
    desc:'退伍侦察兵，铁壁力场守线' },
  { r:'裁判',   job:'Boss 神明系',   id:'Rugal2nd', ms:'m_rugal',  ts:'t_caipan',
    desc:'神明人间代行人，解析体的本体形态' },
  { r:'赵大川', job:'军人/佣兵',     id:'Leona',    ms:'m_leona',  ts:'t_zhaodachuan',
    desc:'皮卡运输命脉，规则夹缝里的普通人' },
  { r:'陈阿姨', job:'辅助医疗',      id:'Hinako',   ms:'m_hinako', ts:'t_chenayi',
    desc:'营地大食堂厨师，后勤与士气补给' },
  { r:'白术',   job:'特工/搜查官',   id:'Lin',      ms:'m_lin',    ts:'t_baizhu',
    desc:'顺风耳情报贩子，窃听与两面交易' },
  { r:'甄选使', job:'异能者',        id:"K'",       ms:'m_k',      ts:'t_zhenxuanshi',
    desc:'锁定异能，10 秒内强制一个人的选择' },
];
const PAGE_SIZE = 6;   // 一页 3 列 × 2 行；一页装满才翻页，不缩格子
const face = (c) => A + c.ms + '-face.png';
const stand = (c) => A + c.ms + '-stand.png';
const ava = (c) => A + c.ts + '.webp';

/* ---------------- 状态 ---------------- */
let mode = '对战';
let team = 3;
let active = { side: 1, idx: 0 };
const p1 = [null, null, null];   // 存角色名（林悦…）或 '?'
const p2 = [null, null, null];
const order = { 1:[0,1,2], 2:[0,1,2] };  // 出场顺序：数组元素=出场位下标
const randSlots = new Set();             // 记录「？随机」抽中的位置（side:idx），再点「？」可取消
let page = 0, pageLock = false;          // 选人列表当前页；pageLock=手动翻页后暂不跟随选中位
const byName = (n) => pool.find((c) => c.r === n) || null;

/* 默认预填：第一格各来一人，首屏不出现空图 */
p1[0] = '苏晚晴';
p2[0] = '江浩';
team = 1;   // 默认 1 人（两人对打），3 人档由顶部「3 人」切换

/* ---------------- 工具 ---------------- */
let tt = 0;
function toast(s) {
  const t = document.getElementById('toast');
  t.textContent = s;
  t.classList.add('on');
  clearTimeout(tt);
  tt = setTimeout(() => t.classList.remove('on'), 1700);
}
function toggleMenu() { document.getElementById('menudd').classList.toggle('open'); }
document.addEventListener('click', (e) => {
  if (!e.target.closest('.menuwrap')) document.getElementById('menudd').classList.remove('open');
});
/* 该出场位里的角色 → 出场序号（1 起） */
function ordOf(side, slotIdx) {
  if (side === 1) {
    const i = order[1].indexOf(slotIdx);
    return i < 0 ? 0 : i + 1;
  }
  const i = order[2].indexOf(slotIdx);
  return i < 0 ? 0 : i + 1;
}
/* 首个出场者（空位跳过） */
function firstOf(side) {
  const L = side === 1 ? p1 : p2;
  for (const i of order[side]) if (i < team && L[i] && L[i] !== '?') return L[i];
  const any = L.slice(0, team).find((x) => x && x !== '?');
  return any || null;
}

/* ---------------- 渲染 ---------------- */
function render() {
  const L1 = p1, L2 = p2;
  const survival = mode === '生存';
  document.getElementById('p2cap').innerHTML = survival ? '3 · 对手（系统随机）'
    : '3 · 对手 <span class="tword">TOONFLOW 角色</span>';
  document.getElementById('p2panel').classList.toggle('sysrand', survival);

  /* 出场位 tiles（左右两栏） */
  const slotsHtml = (side) => {
    const L = side === 1 ? L1 : L2;
    return [...Array(team)].map((_, i) => {
      const n = L[i];
      const c = n && n !== '?' ? byName(n) : null;
      const ord = c ? ordOf(side, i) : 0;
      return `<div class="slot ${active.side === side && active.idx === i ? 'on' : ''}" onclick="act(${side},${i})">
        ${ord ? `<span class="od">${ord}</span>` : ''}
        <div class="th">${c ? `<img src="${ava(c)}" alt="">` : '?'}</div>
        <span class="lb">${c ? c.r : 'P' + (i + 1) + ' 空位'}</span>
      </div>`;
    }).join('');
  };
  document.getElementById('p1slots').innerHTML = slotsHtml(1);
  document.getElementById('p2slots').innerHTML = slotsHtml(2);   /* 生存模式也画出 3 个随机位，保持左右视觉对称 */

  /* 左右大头像：优先显示「当前正在编辑的出场位」，否则显示该队第一个已选角色 */
  const fillPanel = (side) => {
    const s = side === 1 ? 'p1' : 'p2';
    const L = side === 1 ? L1 : L2;
    const img = document.getElementById(s + 'img');
    const vac = document.getElementById(s + 'vac');
    if (survival && side === 2) {
      const rnd = pool[(team + 1) % pool.length];
      img.src = ava(rnd); img.style.display = 'block'; vac.style.display = 'none';
      document.getElementById(s + 'name').textContent = '系统随机';
      document.getElementById(s + 'ent').textContent = '？';
      document.getElementById(s + 'job').textContent = '按资产集抽取';
      document.getElementById(s + 'm1').textContent = '系统随机';
      document.getElementById(s + 'm2').textContent = '？';
      document.getElementById(s + 'm3').textContent = '胜+1 续关';
      return;
    }
    /* 大头像=「我的阵容」当前展示位：正在编辑的位置有货就显示它，否则回落到队列里第一个已选 */
    let want = active.side === side && L[active.idx] ? L[active.idx] : null;
    if (!want) want = L.slice(0, team).find((x) => x && x !== '?') || null;
    if (!want && active.side === side) want = L[active.idx] || null;  /* 只编辑空位且全队为空时保留空态 */
    const c = want && want !== '?' ? byName(want) : null;
    if (c) {
      img.src = ava(c); img.style.display = 'block'; vac.style.display = 'none';
      document.getElementById(s + 'name').textContent = c.r;
      document.getElementById(s + 'ent').textContent = c.id;
      document.getElementById(s + 'job').textContent = c.job;
      document.getElementById(s + 'm1').textContent = c.r;
      document.getElementById(s + 'm2').textContent = c.id;
      document.getElementById(s + 'm3').textContent = c.job + ' · 第 ' + ordOf(side, L.indexOf(c.r)) + ' 位出场';
      return;
    }
    img.style.display = 'none'; vac.style.display = 'flex';
    vac.querySelector('.t').textContent = want === '?' ? '随机位 · 开打时抽一个' : '空位 · 点中间选人列表';
    document.getElementById(s + 'name').textContent = want === '?' ? '？ 随机' : '空位';
    document.getElementById(s + 'ent').textContent = '—';
    document.getElementById(s + 'job').textContent = '—';
    document.getElementById(s + 'm1').textContent = '—';
    document.getElementById(s + 'm2').textContent = '—';
    document.getElementById(s + 'm3').textContent = '—';
  };
  fillPanel(1);
  fillPanel(2);

  /* 中栏 MUGEN 角色 */
  const cur = active.side === 1 ? L1[active.idx] : L2[active.idx];
  const cc = cur && cur !== '?' ? byName(cur) : null;
  const heroImg = document.getElementById('heroImg');
  const heroNone = document.getElementById('heroNone');
  const ghost = document.getElementById('hGhost');
  ghost.textContent = cc ? cc.id : (cur === '?' ? '？' : '');
  if (cc) {
    heroImg.src = stand(cc); heroImg.style.display = 'block'; heroNone.style.display = 'none'; heroImg.classList.remove('silh');
    document.getElementById('hWho').textContent = cc.r;
    document.getElementById('hEnt').textContent = cc.id;
    document.getElementById('hJob').textContent = cc.job;
    document.getElementById('hDesc').textContent = cc.desc;
  } else if (cur === '?') {
    heroImg.src = stand(pool[0]); heroImg.style.display = 'block'; heroImg.classList.add('silh'); heroNone.style.display = 'none';
    document.getElementById('hWho').textContent = '随机';
    document.getElementById('hEnt').textContent = '？';
    document.getElementById('hJob').textContent = '开打时抽取';
    document.getElementById('hDesc').textContent = '再点一次「？」可取消，回到空位重新选';
  } else {
    heroImg.src = stand(pool[0]); heroImg.style.display = 'block'; heroImg.classList.add('silh'); heroNone.style.display = 'none';
    document.getElementById('hWho').textContent = '待选';
    document.getElementById('hEnt').textContent = '—';
    document.getElementById('hJob').textContent = '—';
    document.getElementById('hDesc').textContent = '从下面选人列表点一个 MUGEN 角色（再点一次可取消）';
  }

  /* 选人列表：一页 6 个（3 列 × 2 行），超 6 翻页；「？」随机是列表外常驻按钮，翻到哪页都在 */
  const cells = pool.map((c) => {
    const inP1 = L1.indexOf(c.r);
    const inP2 = L2.indexOf(c.r);
    const sel = (active.side === 1 ? L1[active.idx] : L2[active.idx]) === c.r;
    const ord = inP1 >= 0 ? ordOf(1, inP1) : 0;
    const rnd = (inP1 >= 0 && randSlots.has('1:' + inP1)) || (inP2 >= 0 && randSlots.has('2:' + inP2));
    return `<button class="k ${sel ? 'sel' : ''}" onclick="pick('${c.r}')">
      ${ord ? `<span class="ord">${ord}</span>` : ''}${rnd ? '<span class="rnd">？</span>' : ''}
      <img class="face" src="${face(c)}" alt="">
      <div class="fig"><img src="${stand(c)}" alt=""></div>
      <span class="nm">${c.r}</span>
      <span class="sub"><em>${c.id}</em></span>
      <span class="jobline">${c.job}</span>
    </button>`;
  });

  /* 分页：跟着当前编辑位走（手动翻页后暂不回跳，直到重新点选角色） */
  const total = cells.length;
  const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  const curName = active.side === 1 ? L1[active.idx] : L2[active.idx];
  const qSel = randSlots.has(active.side + ':' + active.idx);
  const selIdx = pool.findIndex((c) => c.r === curName);   // 随机抽中的也会跳到它所在那页
  if (!pageLock && selIdx >= 0) page = Math.floor(selIdx / PAGE_SIZE);
  page = Math.max(0, Math.min(page, pages - 1));
  const pageCells = cells.slice(page * PAGE_SIZE, page * PAGE_SIZE + PAGE_SIZE);
  while (pageCells.length < PAGE_SIZE) pageCells.push('<button class="k void" disabled></button>');
  document.getElementById('roz').innerHTML = pageCells.join('');
  const qb = document.getElementById('qbtn');
  qb.className = 'qbtn' + (qSel ? ' sel' : '');
  qb.innerHTML = qSel ? '<b>？</b> 已随机<span>点一下取消</span>' : '<b>？</b> 随机<span>抽一个，可取消</span>';
  qb.disabled = mode === '生存';
  const pager = document.getElementById('pager');
  pager.style.display = total > PAGE_SIZE ? 'flex' : 'none';
  if (total > PAGE_SIZE) {
    pager.innerHTML = `<button class="pg" onclick="setPage(-1)" ${page === 0 ? 'disabled' : ''}>‹</button>
      <span class="pgt"><b>${page + 1}</b> / ${pages}<i>· 共 ${total} 个角色</i></span>
      <button class="pg" onclick="setPage(1)" ${page === pages - 1 ? 'disabled' : ''}>›</button>`;
  }

  /* 底部名字条 */
  const bar = (side) => {
    const n = firstOf(side);
    const c = n ? byName(n) : null;
    const lineup = (side === 1 ? L1 : L2).slice(0, team).map((x) => {
      const k = x && x !== '?' ? byName(x) : null;
      return k ? `<img src="${ava(k)}" alt="">` : '';
    }).join('');
    if (!c) return `<span class="role" style="color:#5a6478">${side === 1 ? '我方未选' : (survival ? '对手随机生成' : '对手未选')}</span>`;
    return `<span class="role">${c.r}</span><span class="ent">${c.id}</span><span class="job">${c.job}</span>
      <span class="lineup">${lineup}</span>`;
  };
  document.getElementById('bar1').innerHTML = bar(1);
  document.getElementById('bar2').innerHTML = bar(2);

  /* 开始可点条件 */
  const has1 = L1.slice(0, team).some((x) => x);
  const has2 = L2.slice(0, team).some((x) => x);
  document.getElementById('start').disabled = !(has1 && (mode !== '对战' || has2));
}

/* ---------------- 交互 ---------------- */
function act(side, i) { active = { side, idx: i }; pageLock = false; render(); }

/* 翻页：一页 6 个，装满才翻，格子尺寸不变 */
function setPage(d) { pageLock = true; page = Math.max(0, page + d); render(); }

function pick(name) {
  pageLock = false;
  if (mode === '生存' && active.side === 2) { toast('生存模式：对手由系统随机生成，不能手选'); return; }
  const L = active.side === 1 ? p1 : p2;
  const i = active.idx;
  randSlots.delete(active.side + ':' + i);
  if (L[i] === name) { L[i] = null; render(); toast('已取消，可重新选择'); return; }
  if (L.some((x, k) => k !== i && x === name)) { toast('该角色已在本队其他出场位，先取消再选'); return; }
  L[i] = name;
  /* 我方：选完自动跳下一个空位 */
  if (active.side === 1 && i < team - 1 && !p1[i + 1]) active = { side: 1, idx: i + 1 };
  render();
  toast('已选择：' + name + (byName(name) ? ' · ' + byName(name).id : ''));
}

function randomOne() {
  pageLock = false;
  if (mode === '生存' && active.side === 2) { toast('生存模式：对手系统随机生成'); return; }
  const L = active.side === 1 ? p1 : p2;
  const i = active.idx;
  const key = active.side + ':' + i;
  /* 同一个位置再点一次「？」= 取消这次随机，回到空位重选 */
  if (L[i] && randSlots.has(key)) { L[i] = null; randSlots.delete(key); render(); toast('已取消随机结果，可重新选择'); return; }
  const free = pool.filter((c) => !L.some((x, k) => k !== i && x === c.r));
  const pickC = (free.length ? free : pool)[Math.floor(Math.random() * (free.length || pool.length))];
  L[i] = pickC.r; randSlots.add(key);
  render();
  toast('随机抽到：' + pickC.r + ' · ' + pickC.id + '（再点「？」可取消）');
}

function rotateOrder(side) {
  if (mode === '生存' && side === 2) return;
  order[side] = [order[side][team - 1], ...order[side].slice(0, team - 1)];
  render();
  const names = order[side].slice(0, team)
    .map((slot, k) => '第' + (k + 1) + '位 ' + ((side === 1 ? p1 : p2)[slot] || 'P' + (slot + 1)))
    .join(' → ');
  toast('出场顺序已修改：' + names);
}

document.querySelectorAll('.tb[data-m]').forEach((b) => {
  b.onclick = () => {
    document.querySelectorAll('.tb[data-m]').forEach((x) => x.classList.remove('on'));
    b.classList.add('on');
    mode = b.dataset.m;
    active = { side: 1, idx: 0 };
    randSlots.clear(); page = 0; pageLock = false;
    render();
    toast(mode === '练习' ? '练习：只需选我方，对手进对局后默认站桩'
      : mode === '生存' ? '生存：只能选我方，对手系统随机、胜利续关'
      : '对战：双方都要选满，选满才开打');
  };
});
document.getElementById('c1').onclick = () => setTeam(1);
document.getElementById('c3').onclick = () => setTeam(3);
function setTeam(n) {
  team = n;
  document.getElementById('c1').classList.toggle('on', n === 1);
  document.getElementById('c3').classList.toggle('on', n === 3);
  order[1] = [0, 1, 2]; order[2] = [0, 1, 2];
  page = 0; pageLock = false;
  /* 缩编时把多余位上的角色清掉，避免看不见的占位冲突 */
  for (const L of [p1, p2]) for (let i = n; i < 3; i++) L[i] = null;
  randSlots.clear();
  if (active.idx >= n) active = { side: active.side, idx: 0 };
  render();
  toast(n === 1 ? '1 人编队' : '3 人编队：P1/P2/P3 轮流上场，⇄ 改出场顺序');
}

function go() {
  const q = '?mode=' + encodeURIComponent(mode) + '&n=' + team;
  location.href = 'fight.html' + q;
}

/* URL 预选模式 */
(function () {
  const q = new URLSearchParams(location.search);
  const m = q.get('mode');
  if (m) {
    const btn = [...document.querySelectorAll('.tb[data-m]')].find((b) => b.dataset.m === m);
    if (btn) btn.click();
  }
})();
render();
</script>
</body>
</html>
