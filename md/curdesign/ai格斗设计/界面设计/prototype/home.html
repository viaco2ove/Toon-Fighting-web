<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>主界面 · Toon-Fighting</title>
<style>
:root{--bg:#07080b;--panel:#11141b;--line:#262c38;--txt:#e7ecf3;--dim:#8b96a8;--hot:#ff3b30;--gold:#ffc233;--cyan:#3ad1ff}
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(1100px 640px at 75% -12%,#101a2a 0%,var(--bg) 62%);color:var(--txt);
  font-family:'Noto Sans SC','Microsoft YaHei',system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px}
.stage{width:min(760px,100%)}
.brand{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:26px}
.brand h1{font-size:22px;font-weight:900;letter-spacing:.34em}
.brand h1 i{font-style:normal;color:var(--gold)}
.conn{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--dim)}
.dot{width:8px;height:8px;border-radius:50%;background:#2ecc71;box-shadow:0 0 8px #2ecc71}
.card{background:rgba(17,20,27,.88);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:14px}
.row-t{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.row-t b{font-size:13px;letter-spacing:.22em;color:var(--dim)}
.row-t .lnk{font-size:12px;color:var(--cyan);text-decoration:none;margin-left:auto}
.storyval{display:flex;align-items:center;gap:12px}
.storyval .nm{font-size:19px;font-weight:900;letter-spacing:.06em}
.storyval .sw{margin-left:auto;font-size:12px;color:var(--gold);border:1px solid #4d3d12;background:rgba(255,194,51,.08);
  padding:7px 16px;border-radius:8px;cursor:pointer}
.storyval .sw:hover{background:rgba(255,194,51,.16)}
.pack{display:flex;gap:10px;align-items:center}
.pack .pn{font-size:14px;font-weight:700}
.pack .pv{font-size:11px;color:var(--dim);margin-left:8px}
.pack .ch{margin-left:auto;font-size:12px;color:var(--cyan);cursor:pointer}
.bindrow{display:flex;gap:12px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:9px}
.bindrow+.bindrow{margin-top:8px}
.ava{width:38px;height:38px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:16px;color:#fff;background:linear-gradient(135deg,#31435f,#1b2436)}
.ava.a2{background:linear-gradient(135deg,#5f3141,#361b24)}
.ava.a3{background:linear-gradient(135deg,#2f5f4a,#1b3628)}
.ava.a4{background:linear-gradient(135deg,#5a4a2f,#332b18)}
.nm{font-size:13.5px;font-weight:700}
.job{font-size:10px;letter-spacing:.12em;color:var(--gold);border:1px solid #4d3d12;border-radius:12px;padding:2px 8px}
.pos{margin-left:auto}
select{font-family:inherit;font-size:12.5px;padding:6px 10px;border-radius:7px;background:#0d1017;
  border:1px solid var(--line);color:var(--txt);cursor:pointer}
select:hover{border-color:var(--cyan)}
.btns{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
.modebtn{cursor:pointer;font-family:inherit;font-size:15px;font-weight:900;letter-spacing:.3em;text-indent:.3em;
  padding:20px 0;border-radius:12px;border:1px solid var(--line);background:linear-gradient(180deg,#141926,#0e1118);
  color:var(--txt);transition:.16s;text-decoration:none;display:block;text-align:center}
.modebtn:hover{border-color:var(--hot);color:#fff;box-shadow:0 6px 18px rgba(255,59,48,.15);transform:translateY(-2px)}
.modebtn small{display:block;margin-top:6px;font-size:10px;font-weight:400;letter-spacing:.2em;color:var(--dim)}
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:#0d1017;border:1px solid var(--cyan);
  color:var(--txt);font-size:13px;padding:10px 22px;border-radius:22px;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1}
.crumb{position:fixed;top:18px;left:22px;font-size:12px}
.crumb a{color:var(--cyan);text-decoration:none}
</style>
</head>
<body>
<div class="crumb"><a href="index.html">← 原型导航</a> · 主界面</div>
<div class="stage">
  <div class="brand">
    <h1>TOON·<i>FIGHTING</i></h1>
    <div class="conn"><span class="dot"></span>故事联动已连接 · viaco</div>
  </div>

  <div class="card">
    <div class="row-t"><b>当前故事</b><a class="lnk" href="story-list.html">从会话列表切换 ›</a></div>
    <div class="storyval">
      <div class="nm" id="story-nm">末世选择，从解析神明开始成神</div>
      <button class="sw" onclick="location.href='story-list.html'">切换故事</button>
    </div>
  </div>

  <div class="card">
    <div class="row-t"><b>资产集绑定</b></div>
    <div class="pack" onclick="toast('打开资产集选择器（#packpick）')">
      <span class="pn">📦 末世选择，从解析神明开始成神</span>
      <span class="pv">chars 6 · stages 9 · story.json ✓</span>
      <span class="ch">选择资产集文件夹</span>
    </div>
  </div>

  <div class="card">
    <div class="row-t"><b>角色的实体绑定</b></div>
    <div class="pack">
      <span class="pn">为故事角色绑定 MUGEN 实体资产</span>
      <span class="ch" onclick="location.href='roster-bind.html'">点击进入 ›</span>
    </div>
  </div>

  <div class="btns">
    <a class="modebtn" href="select.html?mode=train">练习<small>TRAINING · 假人站桩</small></a>
    <a class="modebtn" href="select.html?mode=versus" style="border-color:#3a2226">对战<small>VERSUS · 正式对决</small></a>
    <a class="modebtn" href="select.html?mode=survival" style="border-color:#2b3a22">生存<small>SURVIVAL · 连胜续关</small></a>
    <a class="modebtn" href="settings.html">设置<small>SETTINGS</small></a>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
let tt;function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('on');
 clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1600)}
</script>
</body>
</html>
