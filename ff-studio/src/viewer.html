<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>ff-studio 角色资产查看器</title>
<style>
:root { --bg:#1b1f26; --panel:#232830; --panel2:#2a303b; --line:#3a4250; --fg:#dde3ea; --dim:#8b94a3; --acc:#4aa3df; --ok:#6ecf8e; }
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--fg); font:13px/1.5 "Segoe UI",system-ui,sans-serif; height:100vh; display:flex; flex-direction:column; overflow:hidden; }
header { display:flex; align-items:center; gap:10px; padding:8px 14px; background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap; }
header h1 { font-size:15px; color:var(--acc); font-weight:600; }
header .sep { width:1px; height:20px; background:var(--line); }
button, select { background:var(--panel2); color:var(--fg); border:1px solid var(--line); border-radius:5px; padding:4px 10px; cursor:pointer; font:inherit; }
button:hover { border-color:var(--acc); }
button.primary { background:#2b5f8a; border-color:#3f7fb5; }
button.on { background:#2b5f8a; }
#dropHint { font-size:12px; color:var(--dim); }
main { flex:1; display:flex; min-height:0; }
aside { width:300px; background:var(--panel); border-right:1px solid var(--line); overflow-y:auto; padding:10px; }
aside h2 { font-size:13px; color:var(--acc); margin:10px 0 6px; font-weight:600; }
aside .kv { font-size:12px; color:var(--dim); margin:2px 0; word-break:break-all; }
aside .kv b { color:var(--fg); font-weight:500; }
#infoBox:empty::after { content:'拖入角色文件夹（含 .def/.sff/.air/.act），或点击上方按钮选择。也支持把多个文件一起拖入。'; color:var(--dim); font-size:12px; }
#center { flex:1; display:flex; flex-direction:column; min-width:0; }
#stageWrap { flex:1; display:flex; align-items:center; justify-content:center; position:relative; min-height:0; background:
  linear-gradient(45deg,#20242c 25%,transparent 25%,transparent 75%,#20242c 75%),
  linear-gradient(45deg,#20242c 25%,#1b1f26 25%,#1b1f26 75%,#20242c 75%), #1b1f26;
  background-size:24px 24px; background-position:0 0,12px 12px; overflow:hidden; }
#stage { image-rendering:pixelated; background:#12151a; box-shadow:0 0 24px rgba(0,0,0,.5); }
#stageBar { display:flex; gap:8px; align-items:center; padding:6px 12px; background:var(--panel); border-top:1px solid var(--line); flex-wrap:wrap; }
#stageInfo { color:var(--dim); font-size:12px; margin-left:auto; }
#playCtl { display:flex; gap:4px; }
#playCtl button { min-width:34px; }
#speed { width:56px; }
#right { width:330px; background:var(--panel); border-left:1px solid var(--line); display:flex; flex-direction:column; }
#tabs { display:flex; border-bottom:1px solid var(--line); }
#tabs div { flex:1; text-align:center; padding:8px; cursor:pointer; color:var(--dim); font-size:13px; }
#tabs div.on { color:var(--acc); background:var(--panel2); font-weight:600; }
#paneAnim, #paneSprite { flex:1; overflow-y:auto; padding:8px; }
#paneSprite { display:none; }

.actRow.on { background:#2b5f8a33; border-color:#3f7fb5; }
.actRow .no { color:var(--acc); font-weight:600; min-width:46px; }
.actRow .meta { color:var(--dim); font-size:11px; margin-left:auto; }
#searchAnim { width:100%; background:var(--panel2); border:1px solid var(--line); color:var(--fg); border-radius:5px; padding:4px 8px; margin-bottom:6px; font:inherit; }

.cell:hover { border-color:var(--acc); }
.cell.on { border-color:var(--acc); background:#2b5f8a33; }

.cell .cap { font-size:10px; color:var(--dim); }

</head>

<header>
  <h1>ff-studio 查看器</h1>
  <div class="sep"></div>
  <button class="primary" id="btnPickDir">选择角色文件夹</button>
  <button id="btnPickFiles">选择文件</button>

      </div>
      <div id="gridSprite"></div>
    </div>

</main>

    img.pal = paletteOfIndex(sff, sp.pal);
    return { ...shade(img, palOverride), ax: sp.ax, ay: sp.ay };
  }
  if (palOverride) {
    const img = decodeV1(buf, target);
    return { ...shade(img, palOverride), ax: target.ax, ay: target.ay };
  }
  const palMap = v1PaletteMap(buf, sff);
  const isFirst = target.group === 0 && target.index === 0;
  const pal = (isFirst ? v1PreloadedPalette(buf, target) : null)
            || palMap.get(target) || v1PreloadedPalette(buf, target);
  const img = decodeV1(buf, target);
  return { ...shade(img, pal), ax: target.ax, ay: target.ay };
}

/* ---------- AIR / DEF 解析 ---------- */
function parseAir(text) {
  const actions = new Map();
  let cur = null, p1 = [], p2 = [];
  for (let raw of text.split(/\r?\n/)) {
    const line = raw.trim();
    if (!line || line.startsWith(';') || line.startsWith('#')) continue;
    let m = line.match(/^\[Begin Action\s+(\d+)/i);
    if (m) { cur = { no: +m[1], frames: [], loopstart: 0 }; actions.set(cur.no, cur); p1 = []; p2 = []; continue; }
    if (!cur) continue;
    if (/^loopstart/i.test(line)) { cur.loopstart = cur.frames.length; continue; }
    let cm = line.match(/^Clsn([12])\[(\d+)\]\s*=\s*(-?\d+)\s*,\s*(-?\d+)\s*,\s*(-?\d+)\s*,\s*(-?\d+)/i);
    if (cm) { (cm[1] === '1' ? p1 : p2).push([+cm[3], +cm[4], +cm[5], +cm[6]]); continue; }
    if (/^Clsn[12]\s*:/i.test(line)) continue;
    const fm = line.match(/^(-?\d+)\s*,\s*(-?\d+)\s*,\s*(-?\d+)\s*,\s*(-?\d+)\s*,\s*(-?\d+)(?:\s*,\s*([^,]+))?(?:\s*,\s*(\S+))?/);
    if (fm) {
      const f = { grp: +fm[1], num: +fm[2], x: +fm[3], y: +fm[4], dur: Math.max(1, +fm[5]),
                  flipH: false, flipV: false, sx: 1, sy: 1, clsn1: p1, clsn2: p2 };
      const flags = (fm[6] || '').toUpperCase();
      if (flags.includes('H')) f.flipH = true;
      if (flags.includes('V')) f.flipV = true;
      if (fm[7]) { const s = fm[7].match(/^S\s*(-?[\d.]+)\s*,\s*(-?[\d.]+)/i); if (s) { f.sx = +s[1]; f.sy = +s[2]; } }
      cur.frames.push(f);
      p1 = []; p2 = [];
    }
  }
  return actions;
}
function parseDef(text) {
  const out = { info: {}, files: {} };
  let sec = null;
  for (let raw of text.split(/\r?\n/)) {
    const line = raw.trim();
    if (!line || line.startsWith(';')) continue;
    let m = line.match(/^\[(.+)\]$/);
    if (m) { sec = m[1].trim().toLowerCase(); continue; }
    const kv = line.match(/^([^=;]+?)\s*=\s*(.*)$/);
    if (kv && sec) {
      const k = kv[1].trim().toLowerCase();
      const v = kv[2].replace(/;.*$/, '').trim();
      if (sec === 'info') out.info[k] = v;
      else if (sec === 'files') out.files[k] = v;
    }
  }
  return out;
}

/* ============================================================
 * 应用状态与 UI
 * ============================================================ */
const $ = (id) => document.getElementById(id);
const state = {
  sffBuf: null, sff: null, palMap: null,      // sff 解析
  def: null, defDir: '', fileName: '',
  airText: '', actions: null,
  pals: [],                                    // [{name, pal}]
  curActNo: null, curFrame: 0, playing: true, speed: 1,
  tickAcc: 0, lastT: 0,
  spriteCache: new Map(),                      // key -> {w,h,rgba}
  selSprite: null,                             // 单帧浏览模式 {g,n}
};
const spriteCache = new Map();

function getSpriteRgba(g, n, pal) {
  const key = g + ',' + n + '|' + (pal ? palNameOf(pal) : '');
  if (spriteCache.has(key)) return spriteCache.get(key);
  let r;
  try { r = spriteRgba(state.sffBuf, state.sff, g, n, pal); } catch (e) { r = null; }
  spriteCache.set(key, r);
  return r;
}
let palSeq = 0;
const palNames = new Map();
function palNameOf(pal) {
  if (!palNames.has(pal)) palNames.set(pal, 'pal' + (++palSeq));
  return palNames.get(pal);
}
function currentPal() {
  const v = $('palSel').value;
  if (!v) return null;
  const p = state.pals.find(x => x.name === v);
  return p ? p.pal : null;
}
function rgbaToCanvas(img, zoom) {
  const c = document.createElement('canvas');
  c.width = img.w; c.height = img.h;
  const ctx = c.getContext('2d');
  const im = new ImageData(new Uint8ClampedArray(img.rgba.buffer, img.rgba.byteOffset, img.w * img.h * 4), img.w, img.h);
  ctx.putImageData(im, 0, 0);
  if (zoom && zoom !== 1) {
    const c2 = document.createElement('canvas');
    c2.width = img.w * zoom; c2.height = img.h * zoom;
    const x2 = c2.getContext('2d');
    x2.imageSmoothingEnabled = false;
    x2.drawImage(c, 0, 0, c2.width, c2.height);
    return c2;
  }
  return c;
}

/* ---------- 渲染：动画帧 或 单帧浏览 ---------- */
function drawFrame(act, fi) {
  const zoom = +$('zoomSel').value;
  const pal = currentPal();
  const actData = state.actions.get(act);
  const canvas = $('stage');
  const f = actData.frames[fi];
  const showClsn = $('showClsn').checked;
  // 先解所有帧 sprite 求 bbox
  const parts = [];
  let minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
  for (const fr of actData.frames) {
    const img = getSpriteRgba(fr.grp, fr.num, pal);
    parts.push({ fr, img });
    if (img) {
      const x0 = fr.x - img.ax, y0 = fr.y - img.ay;
      minX = Math.min(minX, x0); minY = Math.min(minY, y0);
      maxX = Math.max(maxX, x0 + img.w); maxY = Math.max(maxY, y0 + img.h);
    }
  }
  if (minX > maxX) { minX = -40; minY = -120; maxX = 40; maxY = 0; }
  const pad = 10;
  const cw = Math.ceil((maxX - minX + pad * 2) * zoom);
  const ch = Math.ceil((maxY - minY + pad * 2) * zoom);
  canvas.width = Math.max(cw, 320); canvas.height = Math.max(ch, 240);
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const ox = pad - minX, oy = pad - minY;
  // 原点十字
  ctx.strokeStyle = 'rgba(255,255,255,0.18)';
  ctx.beginPath();
  ctx.moveTo((ox) * zoom, 0); ctx.lineTo((ox) * zoom, canvas.height);
  ctx.moveTo(0, (oy) * zoom); ctx.lineTo(canvas.width, (oy) * zoom);
  ctx.stroke();
  const img = parts[fi].img, fr = parts[fi].fr;
  if (!img) {
    ctx.fillStyle = '#e05b5b';
    ctx.font = '13px sans-serif';
    ctx.fillText('缺精灵 ' + fr.grp + ',' + fr.num, 20, 40);
  } else {
    drawSprite(ctx, img, fr, ox, oy, zoom);
  }
  if (showClsn) {
    drawBoxes(ctx, fr.clsn2, ox, oy, zoom, 'rgba(80,200,120,0.9)');
    drawBoxes(ctx, fr.clsn1, ox, oy, zoom, 'rgba(230,90,90,0.9)');
  }
  const dur = actData.frames.reduce((a, b) => a + b.dur, 0);
  $('stageInfo').textContent = `动作 ${act} · 帧 ${fi + 1}/${actData.frames.length} · sprite ${fr.grp},${fr.num} · 时长 ${dur} tick (${(dur / 60).toFixed(2)}s)`;
}
function drawSprite(ctx, img, fr, ox, oy, zoom) {
  const c = rgbaToCanvas(img, 1);
  const dx = (ox + fr.x - img.ax) * zoom;
  const dy = (oy + fr.y - img.ay) * zoom;
  const w = img.w * zoom, h = img.h * zoom;
  ctx.save();
  ctx.translate(dx, dy);
  if (fr.sx !== 1 || fr.sy !== 1) ctx.scale(fr.sx, fr.sy);
  if (fr.flipH) { ctx.translate(w, 0); ctx.scale(-1, 1); }
  if (fr.flipV) { ctx.translate(0, h); ctx.scale(1, -1); }
  ctx.drawImage(c, 0, 0, w, h);
  ctx.restore();
}
function drawBoxes(ctx, boxes, ox, oy, zoom, color) {
  ctx.strokeStyle = color;
  ctx.lineWidth = 1;
  for (const b of boxes || []) {
    ctx.strokeRect((ox + b[0]) * zoom + .5, (oy + b[1]) * zoom + .5, (b[2] - b[0]) * zoom, (b[3] - b[1]) * zoom);
  }
}

/* 单帧浏览渲染 */
function drawSingle(g, n) {
  const zoom = +$('zoomSel').value;
  const pal = currentPal();
  const img = getSpriteRgba(g, n, pal);
  const canvas = $('stage');
  if (!img) {
    canvas.width = 320; canvas.height = 240;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#e05b5b'; ctx.font = '13px sans-serif';
    ctx.fillText('找不到精灵 ' + g + ',' + n, 20, 40);
    $('stageInfo').textContent = '精灵 ' + g + ',' + n + ' 不存在';
    return;
  }
  canvas.width = img.w * zoom + 40; canvas.height = img.h * zoom + 40;
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#12151a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(rgbaToCanvas(img, zoom), 20, 20);
  // axis 十字
  ctx.strokeStyle = 'rgba(255,80,80,0.8)';
  ctx.beginPath();
  const ax = 20 + img.ax * zoom, ay = 20 + img.ay * zoom;
  ctx.moveTo(ax - 8, ay); ctx.lineTo(ax + 8, ay);
  ctx.moveTo(ax, ay - 8); ctx.lineTo(ax, ay + 8);
  ctx.stroke();
  $('stageInfo').textContent = `精灵 ${g},${n} · ${img.w}×${img.h} · axis=(${img.ax},${img.ay})`;
}

/* ---------- 动画播放循环 ---------- */
function tick(t) {
  requestAnimationFrame(tick);
  if (state.curActNo === null || state.selSprite) return;
  const dt = state.lastT ? (t - state.lastT) / 1000 : 0;
  state.lastT = t;
  if (!state.playing) return;
  const act = state.actions.get(state.curActNo);
  if (!act || !act.frames.length) return;
  state.tickAcc += dt * 60 * state.speed;
  let need = false;
  while (state.tickAcc >= act.frames[state.curFrame].dur) {
    state.tickAcc -= act.frames[state.curFrame].dur;
    state.curFrame = (state.curFrame + 1) % act.frames.length;
    need = true;
  }
  if (need) drawFrame(state.curActNo, state.curFrame);
}
requestAnimationFrame(tick);

function playAction(no) {
  const act = state.actions.get(no);
  if (!act || !act.frames.length) return;
  state.curActNo = no; state.curFrame = 0; state.tickAcc = 0;
  state.selSprite = null;
  state.playing = true;
  $('btnPlay').textContent = '⏸';
  document.querySelectorAll('.actRow').forEach(el => el.classList.toggle('on', +el.dataset.no === no));
  drawFrame(no, 0);
}

function reset() {
  state.sffBuf = null; state.sff = null; state.def = null; state.actions = null;
  state.pals = []; state.curActNo = null; state.selSprite = null;
  spriteCache.clear(); palNames.clear(); palSeq = 0;
  $('palSel').innerHTML = '<option value="">内嵌（默认）</option>';
  $('animList').innerHTML = ''; $('gridSprite').innerHTML = '';

  $('stageInfo').textContent = '未载入资产';
  const canvas = $('stage');
  canvas.width = 320; canvas.height = 240;
  canvas.getContext('2d').clearRect(0, 0, 320, 240);

function loadFiles(fileMap, defPath) {
  reset();
  const lower = new Map();
  for (const [p, file] of fileMap) lower.set(p.toLowerCase(), [p, file]);
  const get = (rel) => {
    if (!rel) return null;
    const full = (defPath.replace(/[^/\\]*$/, '') + rel).toLowerCase();
    return lower.get(full) || lower.get(rel.toLowerCase()) || null;
  };
  // 找 def
  let defFile = defPath ? lower.get(defPath.toLowerCase()) : null;
  if (!defFile) {
    const defs = [...lower.entries()].filter(([p]) => p.endsWith('.def'));
    if (!defs.length) { alert('没有找到 .def 文件'); return; }
    defFile = defs[0];
  }
  state.defDir = defFile[0].replace(/[^/\\]*$/, '');
  (async () => {
    try {
      // DEF
      if (defFile) {
        const txt = new TextDecoder('utf-8').decode(await defFile[1].arrayBuffer());
        state.def = parseDef(txt);
        state.fileName = defFile[0].split('/').pop().split('\\').pop();
      }
      const rel = (k) => state.def && state.def.files[k] ? state.def.files[k] : null;
      const sffRel = rel('sprite') || [...lower.keys()].find(p => p.endsWith('.sff'));
      const airRel = rel('anim') || [...lower.keys()].find(p => p.endsWith('.air'));
      const sffPair = get(sffRel) || [...lower.entries()].find(([p]) => p.endsWith('.sff'))?.[1];
      if (!sffPair) throw new Error('没有找到 .sff 文件');
      state.sffBuf = new Uint8Array(await sffPair[1].arrayBuffer());
      state.sff = loadSff(state.sffBuf);
      // AIR
      const airPair = airRel ? get(airRel) : [...lower.entries()].find(([p]) => p.endsWith('.air'))?.[1];
      if (airPair) state.actions = parseAir(new TextDecoder('utf-8').decode(await airPair[1].arrayBuffer()));
      // ACT 调色板
      const acts = [...lower.entries()].filter(([p]) => /\.(act|pal)$/i.test(p)).sort();
      for (const [p, pair] of acts) {
        const buf = new Uint8Array(await pair[1].arrayBuffer());
        try {
          const pal = readPaletteFile(buf);
          const name = p.split('/').pop().split('\\').pop();
          state.pals.push({ name, pal });
        } catch (e) { /* 忽略坏 pal */ }
      }
      renderInfo();
      renderPalSel();
      renderAnimList();
      renderGroupSel();
      // 默认播放第一个动作（优先 0 站立）
      const first = state.actions && (state.actions.has(0) ? 0 : [...state.actions.keys()][0]);
      if (first !== undefined) playAction(first);
      else if (state.sff) drawSingle(0, 0);
    } catch (e) {
      $('warn').textContent = '载入失败：' + e.message;
      console.error(e);
    }
  })();
  function airFileOk(rel) { return !!rel; }
}

function loadFromFiles(arr) {
  // 若有多个 def，优先选带同名的
  const defs = arr.filter(([p]) => /\.def$/i.test(p));
  const map = new Map(arr.map(([p, f]) => [p.replace(/\\/g, '/'), f]));
  let defPath = null;
  if (defs.length === 1) defPath = defs[0][0].replace(/\\/g, '/');
  else if (defs.length > 1) {
    // 找 sff 同名 def（Lin.sff → Lin.def / LinYu.def 与 LinYu/ 目录）
    const sffP = [...map.keys()].find(p => /\.sff$/i.test(p));
    if (sffP) {
      const stem = sffP.split('/').pop().replace(/\.sff$/i, '');
      defPath = (defs.find(([p]) => p.toLowerCase().includes(stem.toLowerCase())) || defs[0])[0].replace(/\\/g, '/');
    } else defPath = defs[0][0];
  }
  loadFiles(map, defPath);
}
/* 拖放 */
window.addEventListener('dragover', (e) => { e.preventDefault(); });
window.addEventListener('drop', async (e) => {
  e.preventDefault();
  const items = [...(e.dataTransfer.items || [])];
  const files = [];
  const walk = async (entry, path) => {
    if (entry.isFile) {
      const f = await new Promise((res, rej) => entry.file(res, rej));
      files.push([path + entry.name, f]);
    } else if (entry.isDirectory) {
      const rd = entry.createReader();
      let batch;
      do {
        batch = await new Promise((res) => rd.readEntries(res, () => res([])));
        for (const en of batch) await walk(en, path + entry.name + '/');
      } while (batch.length);
    }
  };
  const entries = items.map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  if (entries.length) {
    for (const en of entries) await walk(en, '');
    loadFromFiles(files);
  } else {
    loadFromFiles([...e.dataTransfer.files].map(f => [f.name, f]));
  }
});

    box.style.display = '';
    const list = $('packList');
    for (const p of (packs.packs || packs || [])) {
      const name = typeof p === 'string' ? p : (p.dir || p.name || '');
      if (!name) continue;
      const row = document.createElement('div');
      row.className = 'pRow';
      row.innerHTML = '📦 ' + name;
      list.appendChild(row);
      row.onclick = async () => {
        document.querySelectorAll('#packList .pRow').forEach(x => x.classList.remove('on'));
        row.classList.add('on');
        try {
          const meta = await (await fetch('/api/packs/' + encodeURIComponent(name))).json();
          const chars = meta.chars || meta.roster || [];
          // 列出该包下的角色
          const sub = document.createElement('div');
          sub.style.margin = '4px 0 8px 16px';
          sub.innerHTML = '<div class="kv">载入角色（点击）：</div>';
          list.appendChild(sub);
          for (const c of chars) {
            const cid = typeof c === 'string' ? c : (c.charId || c.id || '');
            if (!cid) continue;
            const crow = document.createElement('div');
            crow.className = 'pRow';
            crow.innerHTML = '👤 ' + cid;
            sub.appendChild(crow);
            crow.onclick = () => loadFromServer(name, cid);
          }
        } catch (err) { $('warn').textContent = '读取资产集失败：' + err.message; }
      };
    }
  } catch (e) { /* 非 8100 环境静默 */ }
})();

async function loadFromServer(pack, charId) {
  try {
    const base = '/workshops/toon-fighting-web/map_design/' + encodeURIComponent(pack) + '/chars/' + encodeURIComponent(charId) + '/';
    const files = {};
    // 探测常见文件
    const candidates = [charId + '.def', charId + '.sff', charId + '.air'];
    for (const c of candidates) {
      const r = await fetch(base + c);
      if (!r.ok) continue;
      const buf = await r.arrayBuffer();
      const name = c.split('.').pop().toLowerCase();
      files[c] = new File([buf], c, { type: name === 'def' ? 'text/plain' : 'application/octet-stream' });
    }
    // pal 文件按 pack.json 或常见命名再补
    const meta = await (await fetch('/api/packs/' + encodeURIComponent(pack))).json().catch(() => null);
    // 简化：直接把 sff/air/def 交给 loadFiles（pal 留内嵌）
    loadFromFiles(Object.entries(files));
  } catch (e) {
    $('warn').textContent = '服务器载入失败：' + e.message;
  }
}
</script>
</body>
